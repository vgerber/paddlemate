server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. They sit at server level on purpose: nginx drops
    # inherited add_header lines in any block that sets its own.
    #
    # The CSP is built from what the app loads:
    #   connect-src / img-src  OpenFreeMap (style, tiles, glyphs, sprites) and
    #                          Esri aerial tiles for the satellite toggle
    #   connect-src            Keycloak (OIDC discovery, token, userinfo)
    #   worker-src blob:       MapLibre's workers; 'self' is the PWA service worker
    #   style-src unsafe-inline  MUI/emotion injects style tags and style
    #                          attributes; scripts get no inline allowance
    # The API and /api/media are same-origin behind the reverse proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self' https://auth.vgerber.io https://tiles.openfreemap.org https://server.arcgisonline.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

    # Frontend SPA - fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
