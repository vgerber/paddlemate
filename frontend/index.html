<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- No viewport-fit=cover, except on iOS (the script below adds it):
         mobile Firefox and Chrome on Android report a bottom safe-area inset
         under cover without drawing the page beneath the gesture bar, so the
         env() paddings turn into dead space. iOS does draw an installed app
         under the home indicator, and reports the inset only with cover. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The phone's system buttons sit on this frame colour. The light-media
         meta follows the app's scheme (colorMode.ts); the dark-media meta
         stays dark, so a dark device with the app forced Light keeps a dark
         frame its buttons show on. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141b1f" media="(prefers-color-scheme: dark)" />
    <!-- Dark mode, before first paint (the bundle is a module and arrives
         later). The script mirrors resolveScheme in src/lib/colorMode.ts, the
         style the grounds in src/lib/theme.ts; colorMode.test.ts holds both. -->
    <style>
      html { background: #eef2f3; }
      html[data-theme="dark"] { background: #141b1f; color-scheme: dark; }
      @media print {
        html[data-theme="dark"] { background: #ffffff; color-scheme: light; }
      }
    </style>
    <script>
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem("paddlemate-color-mode");
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        // Mirrors resolveMotion in src/lib/motionMode.ts.
        var motion = null;
        try {
          motion = localStorage.getItem("pm-motion");
        } catch (e) {}
        var reduced =
          motion === "reduced" ||
          (motion === "system" &&
            matchMedia("(prefers-reduced-motion: reduce)").matches);
        document.documentElement.setAttribute(
          "data-motion",
          reduced ? "reduced" : "full",
        );
        document
          .querySelector('meta[name="theme-color"][media*="light"]')
          .setAttribute("content", dark ? "#141b1f" : "#ffffff");
        // iOS, iPads that call themselves a Mac included: draw to the edge
        // and keep the bottom chrome above the home indicator (theme.ts).
        var ios =
          /iPhone|iPad|iPod/.test(navigator.userAgent) ||
          (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        if (ios) {
          document.documentElement.setAttribute("data-ios", "");
          var vp = document.querySelector('meta[name="viewport"]');
          vp.setAttribute("content", vp.getAttribute("content") + ", viewport-fit=cover");
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <title>Paddlemate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
