<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- No viewport-fit=cover: mobile Firefox reports a bottom safe-area
         inset under cover without actually drawing the page beneath the
         gesture bar, so the env() paddings turn into dead space. Without
         cover every inset is 0 and the browser manages the unsafe areas.
         (Trade-off: Chrome 15+ edge-to-edge paints its own chin there.) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The frame follows the phone: a phone in dark mode draws its system
         buttons light, so the bar behind them must be dark even while the app
         itself is light. The dark value is dark mode's ground. The manifest
         cannot carry a pair; these tags override it at runtime. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141b1f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <title>Paddlemate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
