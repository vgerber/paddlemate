name: API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paddlemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paddlemate
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: api
        run: cargo fmt --check

      - name: Clippy
        working-directory: api
        run: cargo clippy -- -D warnings

      - name: Build
        working-directory: api
        run: cargo build

      # Includes tests/migration_rules.rs, which fails on a migration that
      # changes search_key without a REINDEX - a fresh CI database cannot
      # catch that, because it builds its indexes from the current function.
      - name: Test
        working-directory: api
        run: cargo test

      - name: Install sqlx-cli
        run: |
          command -v sqlx >/dev/null ||
            cargo install sqlx-cli --version 0.8.6 --locked \
              --no-default-features --features rustls,postgres

      # SQLX_OFFLINE only governs the compile-time query cache; the migrations
      # run against the Postgres service above, which is the only place they are
      # exercised before a deploy.
      - name: Apply migrations
        working-directory: api
        run: sqlx migrate run

      - name: Assert search normalization
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f api/tests/sql/search_key_assertions.sql
