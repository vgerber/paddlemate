services:
  db:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paddlemate
    ports:
      - "6432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  # Local identity provider, so authenticated flows can be exercised against
  # a real token instead of a hand-written session. Imports keycloak/realm-local.json
  # (regenerate with `sh keycloak/build-realm.sh`). Opt in with:
  #   docker compose --profile auth up -d keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Only the realm file - Keycloak treats every JSON in this directory as
      # a realm, and the *-client.json files are fragments, not realms.
      - ./keycloak/realm-local.json:/opt/keycloak/data/import/realm-local.json:ro

  # api:
  #   build:
  #     context: ./api
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@db:5432/paddlemate
  #     KEYCLOAK_URL: http://keycloak:8080
