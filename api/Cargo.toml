[workspace]
members = [".", "river-gauge"]
resolver = "2"

[package]
name = "paddlemate_api"
version = "0.1.0"
edition = "2024"
default-run = "paddlemate_api"

[dependencies]
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-query", "macros"] }
river-gauge = { path = "river-gauge" }
anyhow = "1"
axum = { version = "0.8.6", features = ["macros", "query", "multipart"] }
axum-keycloak-auth = "0.8.3"
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15.7"
getrandom = { version = "0.3", features = ["std"] }
indexmap = "2.12.0"
moka = { version = "0.12.11", features = ["future"] }
reqwest = { version = "0.12.24", features = ["json"] }
schemars = { version = "0.9.0", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "migrate", "chrono", "json"] }
time = "0.3"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
# Decode/re-encode uploads: strips EXIF (phone photos carry GPS) and caps
# the stored dimensions.
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }

